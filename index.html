<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Preparazione Forze Speciali</title>
<meta name="description" content="100 allenamenti a corpo libero per GL, F e G, con schede, timer e archivio.">
<meta name="theme-color" content="#eef2f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1518" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Corpo libero · stile delle bozze approvate (fase 4) e dell'anteprima schede. Una colonna larga come un telefono. */
:root{
  --bg:#eef2f3; --card:#ffffff; --panel:#f4f7f8; --ink:#16232b; --muted:#5a6a73; --line:#d6dee2;
  --trx:#2f6fd8; --trx-tint:#e3ecfb; --db:#ee7a1f; --db-dark:#b85a10; --db-tint:#fdeedd;
  --warn:#c13f2b; --warn-tint:#fbe9e5; --note:#f7f1d9; --note-line:#d9c46c; --ok:#1f6b45; --ok-tint:#dcefe4;
  --fig:#16232b; --fig-bg:#f4f7f8; --floor:#c3cdd2; --scrim:rgba(14,21,24,.5); --shadow:rgba(10,20,25,.35);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --top:env(safe-area-inset-top,0px); --bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1518; --card:#162127; --panel:#1b282f; --ink:#e4ecef; --muted:#97a8b0; --line:#2b3a42;
  --trx:#5f95f0; --trx-tint:#1c2c47; --db:#f08a35; --db-dark:#b85f16; --db-tint:#3a2614;
  --warn:#f07a64; --warn-tint:#3a1d18; --note:#2e2a17; --note-line:#7c6c2a; --ok:#7fd3a5; --ok-tint:#173226;
  --fig:#e4ecef; --fig-bg:#1b282f; --floor:#41525b; --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.7); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1518; --card:#162127; --panel:#1b282f; --ink:#e4ecef; --muted:#97a8b0; --line:#2b3a42;
  --trx:#5f95f0; --trx-tint:#1c2c47; --db:#f08a35; --db-dark:#b85f16; --db-tint:#3a2614;
  --warn:#f07a64; --warn-tint:#3a1d18; --note:#2e2a17; --note-line:#7c6c2a; --ok:#7fd3a5; --ok-tint:#173226;
  --fig:#e4ecef; --fig-bg:#1b282f; --floor:#41525b; --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.7); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ink)}
:focus-visible{outline:3px solid var(--trx);outline-offset:2px}
svg.i{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Struttura */
#app{max-width:34rem;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.appbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(4px + var(--top)) max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px));min-height:calc(56px + var(--top))}
.content{flex:1;padding:4px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.has-tabs .content{padding-bottom:calc(96px + var(--bottom))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:6px 10px calc(8px + var(--bottom))}
.tabbar-in{max-width:34rem;margin:0 auto;display:grid;grid-template-columns:1fr 1fr}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;border:0;background:none;color:var(--muted);font:600 .8rem var(--body);text-decoration:none}
.tab .ico{display:grid;place-items:center;width:56px;height:30px;border-radius:999px}
.tab .ico svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .ico{background:var(--line)}

/* Elementi comuni */
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 8px 0 0;margin-left:-6px;border:0;background:none;font:600 1rem var(--body);color:var(--ink);text-decoration:none}
.back svg{width:24px;height:24px}
.bar-meta{font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.wm{font:700 1.5rem/1 var(--display);letter-spacing:.01em;margin:0}
.appbar .wm{min-width:0;text-wrap:balance}
.pchip{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--card);font:700 1.1rem/40px var(--display);flex:none;text-align:center;text-decoration:none;color:var(--ink)}
h1.big{font:700 2.1rem/1 var(--display);margin:0;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.88rem;font-weight:600;padding:3px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.tag{display:inline-block;font-size:.76rem;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--panel);border:1px solid var(--line);color:var(--ink);white-space:nowrap;line-height:1.5}
.tag.trx{background:var(--trx-tint);border-color:var(--trx)}
.tag.db{background:var(--db-tint);border-color:var(--db)}
.tag.new{background:var(--note);border:1px dashed var(--note-line)}
.tag.light{background:var(--ok-tint);border-color:var(--ok)}
.tag.skip{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.tag.heavy{background:var(--warn-tint);border-color:var(--warn)}
.primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border:0;border-radius:14px;background:var(--ink);color:var(--card);font:700 1.3rem var(--display);letter-spacing:.04em;text-transform:uppercase;text-decoration:none}
.primary[disabled]{opacity:.4;cursor:default}
.ghost{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:1.5px solid var(--ink);border-radius:12px;background:transparent;color:var(--ink);font:600 1rem var(--body);width:100%;text-decoration:none;padding:0 12px}
.ghost.danger{border-color:var(--warn);color:var(--warn)}
.danger-btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border:0;border-radius:14px;background:var(--warn);color:#fff;font:700 1.3rem var(--display);letter-spacing:.04em;text-transform:uppercase}
.textbtn{border:0;background:none;font:600 1rem var(--body);color:var(--ink);min-height:44px;text-decoration:underline;text-underline-offset:3px;padding:0 4px}
.who{font:700 .95rem/1.4 var(--display);border:1.5px solid var(--ink);border-radius:5px;padding:0 5px;text-align:center;min-width:1.7rem}
.small{font-size:.9rem;color:var(--muted);margin:0}
.small b{color:var(--ink);font-weight:600}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.box > span{min-width:0}
.note{background:var(--note);border:1.5px dashed var(--note-line);border-radius:12px;padding:10px 12px;font-size:.95rem;display:flex;flex-direction:column;gap:8px}
.note p{margin:0}
.note.warn{background:var(--warn-tint);border:1.5px solid var(--warn)}
.note.ok{background:var(--ok-tint);border:1.5px solid var(--ok)}
.note .row{display:flex;flex-wrap:wrap;gap:8px}
.note .row .ghost{width:auto;flex:1 1 9rem;min-height:44px}
.banner{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--ink);border-radius:12px;padding:8px 8px 8px 12px;font-size:.95rem}
.banner span{flex:1}
.banner .ghost{width:auto;min-height:40px;padding:0 14px}
.x{border:0;background:none;width:40px;height:40px;display:grid;place-items:center;color:var(--muted);flex:none}

/* Profilo */
.prof{justify-content:center;gap:22px;padding-block:calc(28px + var(--top)) 28px}
.brand{display:flex;flex-direction:column;gap:8px}
.brand svg{width:60px;height:60px}
.brand .wm{font-size:2.5rem}
.brand p{margin:0;color:var(--muted)}
.q{font:700 1.4rem/1.15 var(--display);margin:0}
.ptiles{display:flex;flex-direction:column;gap:10px}
.ptile{display:grid;grid-template-columns:4rem 1fr 1.5rem;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);text-align:left;min-height:78px}
.ptile .ini{font:700 2.3rem/1 var(--display);text-align:center}
.ptile .pdesc{font-size:.95rem;color:var(--muted);line-height:1.3}
.ptile .radio{width:1.4rem;height:1.4rem;border-radius:50%;border:2px solid var(--muted)}
.ptile[aria-checked="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.ptile[aria-checked="true"] .radio{border-color:var(--ink);background:radial-gradient(circle,var(--ink) 0 42%,transparent 47%)}
.fine{font-size:.9rem;color:var(--muted);margin:0}

/* Elenco */
.progress{display:flex;flex-direction:column;gap:8px}
.prog-top{display:flex;align-items:baseline;gap:8px}
.prog-n{font:700 2.8rem/1 var(--display);font-variant-numeric:tabular-nums}
.prog-of{color:var(--muted)}
.phases{display:grid;grid-template-columns:14fr 48fr 38fr;gap:3px}
.phases span{display:flex;flex-direction:column;gap:3px;font-size:.74rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;min-width:0}
.phases i{display:block;height:8px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.phases i b{position:absolute;inset:0 auto 0 0;background:var(--ok)}
.progress p{margin:0;font-size:.93rem}
.next{background:var(--ink);color:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.next-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.next .eyebrow{color:var(--card);opacity:.8}
.next-meta{font-size:.85rem;opacity:.8;text-align:right}
.next-title{font:700 2.3rem/1 var(--display);margin:0}
.next-facts{display:flex;flex-wrap:wrap;gap:4px 16px}
.next-facts b{font-weight:600}
.next-new{margin:0;font-size:.92rem;opacity:.85}
.next .primary{background:var(--card);color:var(--ink)}
.next .tag{color:var(--ink)}
.blocks{display:flex;flex-direction:column;gap:8px}
.blk{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.blk summary{list-style:none;display:grid;grid-template-columns:1fr auto 1.2rem;align-items:center;gap:10px;padding:10px 12px 10px 14px;cursor:pointer;min-height:58px}
.blk summary::-webkit-details-marker{display:none}
.blk-t{display:flex;flex-direction:column;min-width:0}
.blk-name{font:700 1.15rem/1.15 var(--display)}
.blk-sub{font-size:.82rem;color:var(--muted)}
.blk-count{font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.blk-count.ok{color:var(--ok)}
.chev{width:1.2rem;height:1.2rem;color:var(--muted);transition:transform .2s}
.blk[open] .chev{transform:rotate(180deg)}
.wlist{list-style:none;margin:0;padding:0}
.wrow{display:grid;grid-template-columns:2.6rem minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px 10px 14px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.wnum{width:2.6rem;height:2.6rem;border-radius:10px;border:1.5px solid var(--line);display:grid;place-items:center;font:700 1.2rem var(--display);font-variant-numeric:tabular-nums}
.wrow.done .wnum{background:var(--ok-tint);border-color:transparent;color:var(--ok)}
.wrow.skip .wnum{border-style:dashed;color:var(--muted)}
.wrow.is-next .wnum{background:var(--ink);color:var(--card);border-color:var(--ink)}
.wmain{min-width:0;display:flex;flex-direction:column}
.wl1{font-weight:600;font-size:.95rem}
.wl2{font-size:.84rem;color:var(--muted);line-height:1.3}
.wend{font-size:.8rem;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.wend.ok{color:var(--ok);font-weight:600}
.wend .tag{font-size:.72rem}

/* Dettaglio */
.dhead{display:flex;flex-direction:column;gap:8px}
.prep{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.92rem}
.prep-l{font-weight:600;margin-right:2px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-top:2px solid var(--ink);padding-top:10px}
.sec-h h2{font:700 1.2rem var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0}
.sec-h span{font-size:.88rem;color:var(--muted)}
.tbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;font:600 .95rem var(--body);white-space:nowrap;flex:none;text-decoration:none;color:var(--ink)}
.giri{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.giro{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;font:700 1.2rem var(--display)}
.giro[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--card)}
.exlist{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ex{border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex a{display:grid;grid-template-columns:1.3rem minmax(0,1fr) auto;gap:4px 10px;padding:12px 12px 12px 14px;align-items:start;color:var(--ink);text-decoration:none}
.ex-o{font:700 1.05rem/1.3 var(--display);color:var(--muted)}
.ex-name{font-weight:600;font-size:1.02rem;line-height:1.25}
.ex-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.ex-rep{text-align:right;display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.ex-rep b{font:700 2.1rem/1 var(--display);font-variant-numeric:tabular-nums}
.ex-rep small{font-size:.74rem;color:var(--muted);margin-top:3px;white-space:nowrap}
.ex-var{grid-column:2 / -1;display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;background:var(--panel);border-radius:8px;padding:6px 8px;font-size:.88rem;line-height:1.35;margin-top:4px}
.between{text-align:center;font-size:.88rem;color:var(--muted);margin:0}
.done-bar{position:sticky;bottom:0;margin-top:auto;padding:14px 16px calc(14px + var(--bottom));background:linear-gradient(to bottom,transparent,var(--bg) 30%);display:flex;flex-direction:column;gap:8px}
.donebox{background:var(--ok-tint);border:1.5px solid var(--ok);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.donebox b{font:700 1.25rem var(--display)}
.donebox i{font-size:.92rem}

/* Scheda */
.today{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.today div{padding:8px 10px;display:flex;flex-direction:column;border-left:1px solid var(--line);min-width:0}
.today div:first-child{border-left:0}
.today b{font:700 1.5rem/1.1 var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.today span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:14px}
.card header{display:flex;flex-direction:column;gap:6px}
.card .name{font:700 1.75rem/1.05 var(--display);margin:0;text-wrap:balance}
.alt{margin:0;color:var(--muted);font-style:italic}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.muscles{margin:0}
.muscles b{font-weight:600}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.figs.n3{grid-template-columns:repeat(3,1fr);gap:6px}
.figs.n1{grid-template-columns:minmax(0,1fr);width:100%;max-width:60%;margin-inline:auto}
.figs figure{margin:0;background:var(--panel);border-radius:10px;padding:6px 6px 4px;display:flex;flex-direction:column;gap:2px;min-width:0}
.figs svg{display:block;width:100%;height:auto}
.figs figcaption{text-align:center;font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.figs.n3 figcaption{font-size:.68rem;letter-spacing:.04em}
.yourvar{display:flex;flex-direction:column;gap:4px;border:2px solid var(--ink);border-radius:10px;padding:10px 12px}
.yourvar span{font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.yourvar p{margin:0;font-weight:500}
.card h2{font:700 1.1rem var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0 0 6px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:1.6rem 1fr;gap:8px}
ol.steps li::before{content:counter(s);font:700 1.05rem/1.6rem var(--display);width:1.6rem;height:1.6rem;border-radius:50%;background:var(--ink);color:var(--card);text-align:center}
ul.errs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ul.errs li{display:grid;grid-template-columns:1.1rem 1fr;gap:8px}
ul.errs li::before{content:"";width:.7rem;height:.7rem;margin-top:.45rem;background:linear-gradient(45deg,transparent 42%,var(--warn) 42% 58%,transparent 58%),linear-gradient(-45deg,transparent 42%,var(--warn) 42% 58%,transparent 58%)}
.vars{display:flex;flex-direction:column;gap:6px}
.var{display:grid;grid-template-columns:2.4rem 1fr;gap:8px;align-items:start;padding:8px 10px;border-radius:8px;background:var(--panel);border:1.5px solid transparent}
.var p{margin:0}
.var.mine{border-color:var(--ink)}
.var.none p{color:var(--muted)}
.videos{display:flex;flex-direction:column;gap:8px}
.video{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:var(--ink);color:var(--card);text-decoration:none}
.video .play{flex:none;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--card);display:grid;place-items:center}
.video .play::before{content:"";border-left:.75rem solid var(--ink);border-top:.45rem solid transparent;border-bottom:.45rem solid transparent;margin-left:.2rem}
.video span{display:flex;flex-direction:column;min-width:0}
.video strong{font-weight:600}
.video small{opacity:.8;font-size:.85rem;overflow-wrap:anywhere}
.vnote{margin:2px 0 0;font-size:.85rem;color:var(--muted)}

/* Timer */
.timer{gap:18px;align-items:stretch}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;align-self:center}
.seg a,.seg button{font:600 .92rem var(--body);border:0;background:transparent;color:var(--ink);padding:8px 14px;min-height:40px;text-decoration:none;display:inline-flex;align-items:center}
.seg a+a{border-left:1.5px solid var(--ink)}
.seg [aria-current="true"]{background:var(--ink);color:var(--card)}
.tphase{text-align:center;display:flex;flex-direction:column;gap:2px}
.tphase b{font:700 2rem/1.1 var(--display)}
.tphase span{color:var(--muted)}
.ring{position:relative;width:236px;max-width:72vw;aspect-ratio:1;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring .trk{stroke:var(--line)}
.ring .arc{stroke:var(--ink)}
.ring.pausa .arc{stroke:var(--trx)}
.ring.fine .arc{stroke:var(--ok)}
.ring-t{position:absolute;inset:0;display:grid;place-items:center;font:700 4.4rem/1 var(--display);font-variant-numeric:tabular-nums}
.tseq{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tseq span{display:flex;flex-direction:column;align-items:center;font-size:.8rem;line-height:1.25;padding:4px 2px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-variant-numeric:tabular-nums}
.tseq span b{font-weight:600}
.tseq span.cur{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tseq span.fatto{color:var(--ok);border-color:var(--ok)}
.tctl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;justify-items:center}
.tplay{width:84px;height:84px;border-radius:50%;border:0;background:var(--ink);color:var(--card);display:grid;place-items:center}
.tplay svg{width:34px;height:34px;fill:currentColor;stroke:none}
.tsmall{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 .85rem var(--body);color:var(--ink);min-height:48px;min-width:64px;justify-content:center}
.tfoot{margin:auto 0 0;text-align:center;font-size:.88rem;color:var(--muted)}

/* Archivio */
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stats div{padding:10px 12px;border-left:1px solid var(--line);display:flex;flex-direction:column}
.stats div:first-child{border-left:0}
.stats b{font:700 2rem/1 var(--display);font-variant-numeric:tabular-nums}
.stats span{font-size:.8rem;color:var(--muted)}
.weeks{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.weeks-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.weeks-h b{font:700 1.05rem var(--display);letter-spacing:.04em;text-transform:uppercase}
.weeks-h span{font-size:.8rem;color:var(--muted)}
.wk-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk{display:flex;flex-direction:column;align-items:center;gap:5px}
.wk-dots{display:flex;flex-direction:column-reverse;gap:4px}
.wk-dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line)}
.wk-dots i.on{background:var(--ok);border-color:var(--ok)}
.wk small{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.wk.cur small{color:var(--ink);font-weight:600}
.month{font:700 1rem var(--display);letter-spacing:.06em;text-transform:uppercase;margin:4px 0 -8px;color:var(--muted)}
.alist{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.alist li{border-top:1px solid var(--line)}
.alist li:first-child{border-top:0}
.arow{display:grid;grid-template-columns:2.8rem minmax(0,1fr) 1.1rem;gap:10px;align-items:center;padding:10px 12px;color:var(--ink);text-decoration:none}
.adate{display:flex;flex-direction:column;align-items:center;line-height:1}
.adate b{font:700 1.55rem/1 var(--display);font-variant-numeric:tabular-nums}
.adate small{font-size:.7rem;text-transform:uppercase;color:var(--muted);font-weight:600;letter-spacing:.05em;margin-top:2px}
.amain{display:flex;flex-direction:column;min-width:0}
.amain b{font-weight:600}
.amain b .tag{margin-left:6px;vertical-align:1px}
.amain span{font-size:.84rem;color:var(--muted)}
.amain i{font-size:.85rem;color:var(--ink);margin-top:2px}
.arow .chev{transform:rotate(-90deg)}
.arow.skip{color:var(--muted)}
.arow.skip .adate{visibility:hidden}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:18px 16px;text-align:center;color:var(--muted)}
.backup{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.backup .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Fogli (segna come fatto, conferme) */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;animation:fade .15s ease-out}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:34rem;margin:0 auto;max-height:92vh;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;padding:10px 16px calc(18px + var(--bottom));display:flex;flex-direction:column;gap:12px;animation:up .2s ease-out;box-shadow:0 -10px 30px -20px var(--shadow)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);align-self:center;flex:none}
.sheet h2{font:700 1.7rem/1.05 var(--display);margin:0}
.sheet p{margin:0}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-weight:600;font-size:.92rem}
.field input,.field textarea{font-size:1rem;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.field textarea{resize:vertical;min-height:4.6rem;line-height:1.35}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--bottom));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--card);border-radius:999px;padding:10px 18px;font-weight:600;font-size:.95rem;box-shadow:0 10px 24px -14px var(--shadow);max-width:calc(100vw - 32px);text-align:center;animation:fade .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.chev{transition:none}.sheet,.scrim,.toast{animation:none}}
@media (min-width:600px){.sheet{bottom:24px;border-radius:22px}}

</style>

    return appbar(bottoneIndietro('Elenco', '#/elenco')) + '<main class="content"><p class="empty">Pagina non trovata.</p></main>';
  }

  /* ---------------- Disegno della schermata ---------------- */
  function render(nuova) {
    var r = parse(location.hash);
    if (!S.profilo && r.p[0] !== 'profilo') { history.replaceState({ d: 0 }, '', '#/profilo'); depth = 0; r = parse('#/profilo'); }
    if (r.p[0] !== 'profilo') profSel = null;
    var s = r.p[0], h, tabs = false;
    if (s === 'profilo') h = schermoProfilo();
    else if (s === 'archivio') { h = schermoArchivio(); tabs = true; }
    else if (s === 'a' && r.p[2] === 'e') h = schermoScheda(r);
    else if (s === 'a' && r.p[2] === 'timer') h = schermoTimer(r);
    else if (s === 'a') h = schermoAllenamento(r);
    else { h = schermoElenco(); tabs = true; if (s !== 'elenco') history.replaceState({ d: depth }, '', '#/elenco'); }
    app.innerHTML = h;
    app.className = tabs ? 'has-tabs' : '';
    ultimoHash = location.hash;
    disegnaTimer();
    window.scrollTo(0, nuova ? 0 : (scrollMem[location.hash] || 0));
  }

  /* ---------------- Fogli: segna come fatto, conferme ---------------- */
  function apriFoglio(html) {
    chiudiFoglioDom();
    fogli.innerHTML = '<div class="scrim" data-act="chiudi-foglio"></div><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><span class="grab" aria-hidden="true"></span>' + html + '</section>';
    foglio = true;
    document.body.style.overflow = 'hidden';
    history.pushState({ d: depth, foglio: 1 }, '', location.hash);
    var t = fogli.querySelector('h2'); if (t) { t.setAttribute('tabindex', '-1'); t.focus({ preventScroll: true }); }
  }
  function chiudiFoglio(poi) { dopoFoglio = poi || null; history.back(); }
  function chiudiFoglioDom() { fogli.innerHTML = ''; foglio = false; document.body.style.overflow = ''; }

  function testoRiposo(n, data) {
    var ult = null;
    A().voci.forEach(function (v) { if (v.t === 'fatto' && v.data <= data && (!ult || v.data > ult.data)) ult = v; });
    if (!ult || !/^\d{4}-\d{2}-\d{2}$/.test(data)) return '';
    var g = giorni(ult.data, data);
    if (g === 0) return 'Quel giorno è già segnato l\'allenamento ' + ult.n + '. Tra due sedute, almeno un giorno di riposo.';
    if (g === 1) return 'Il giorno prima c\'è l\'allenamento ' + ult.n + ': tra due sedute, almeno un giorno di riposo.';
    return '';
  }
  function foglioSegna(n) {
    var rr = R(), p = rr.prossimo, c = contesto(n, {}), info = '', dopo = '';
    if (n > p) info = '<p class="note warn">' + cap(dal(p, n - 1)) + (n - 1 === p ? ' risulterà saltato' : ' risulteranno saltati') + '. Succede quando il gruppo va avanti senza di te: si possono recuperare più avanti.</p>';
    else if (n < p && rr.fatti[n]) info = '<p class="note">L\'hai già fatto ' + giorno(rr.fatti[n][rr.fatti[n].length - 1].data) + '. Lo segni di nuovo? Il prossimo resta il ' + p + '.</p>';
    else if (n < p) info = '<p class="note">Recuperi l\'allenamento ' + n + ', che risultava saltato. Il prossimo resta il ' + p + '.</p>';
    if (n >= p) dopo = n === 100 ? 'È l\'ultimo dei 100.' : 'Il prossimo sarà il ' + (n + 1) + '.';
    var oggiS = oggi();
    apriFoglio('<h2 id="sh-t">Allenamento ' + n + ' fatto</h2>' +
      '<p class="small">Finisce nell\'archivio di questo telefono' + (c.v.versioneLeggera ? ', in versione leggera' : '') + '.</p>' + info +
      '<div class="field"><label for="f-data">Data</label><input type="date" id="f-data" value="' + oggiS + '" max="' + oggiS + '"></div>' +
      '<p class="small" id="f-riposo">' + esc(testoRiposo(n, oggiS)) + '</p>' +
      '<div class="field"><label for="f-nota">Nota, se vuoi</label><textarea id="f-nota" rows="3" maxlength="500" placeholder="Com\'è andata? Troppo facile, troppo lungo, un esercizio scomodo…"></textarea></div>' +
      '<button type="button" class="primary" data-act="salva-fatto" data-n="' + n + '">Salva nell\'archivio</button>' +
      '<button type="button" class="textbtn" data-act="chiudi-foglio">Annulla</button>' +
      (dopo ? '<p class="small">' + dopo + '</p>' : ''));
  }
  function salvaFatto(n) {
    var data = (el('f-data').value || '').trim(), nota = (el('f-nota').value || '').trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(data)) { toast('Scegli la data'); return; }
    var a = A(), rr = R(), c = contesto(n, {});
    var voce = { id: uid(), t: 'fatto', n: n, data: data };
    if (nota) voce.nota = nota;
    if (c.v.versioneLeggera) voce.leggera = true;
    if (n < rr.prossimo) voce.rec = true;
    a.voci.push(voce);
    delete a.giri[n];
    if (voce.leggera) a.leggera = false;
    if (!salva()) return;
    chiediPersistenza();
    chiudiFoglio(function () { allaRadice('#/elenco'); toast('Allenamento ' + n + ' nell\'archivio ✓'); });
  }
  function foglioAnnulla(id) {
    var a = A(), v = a.voci.filter(function (x) { return x.id === id; })[0];
    if (!v) return;
    var prima = R(), dopo = CL.replay(a.voci.filter(function (x) { return x.id !== id; })), cons = '';
    if (dopo.prossimo !== prima.prossimo) cons = 'Il prossimo tornerà il ' + dopo.prossimo + '.';
    else if (v.rec && !dopo.fatti[v.n] && v.n < dopo.prossimo) cons = 'Tornerà tra i saltati.';
    var tit = v.t === 'riparti' ? 'Annulli la ripartenza?' : 'Annulli il «fatto»?';
    var desc = v.t === 'riparti' ? 'Ripartenza dal ' + v.n + ', del ' + giorno(v.data) + '.' : 'Allenamento ' + v.n + ', segnato ' + giorno(v.data) + '.';
    apriFoglio('<h2 id="sh-t">' + tit + '</h2><p>' + desc + '</p>' + (cons ? '<p class="small">' + cons + '</p>' : '') +
      '<button type="button" class="danger-btn" data-act="conferma-annulla" data-id="' + id + '">' + (v.t === 'riparti' ? 'Annulla la ripartenza' : 'Annulla il «fatto»') + '</button>' +
      '<button type="button" class="textbtn" data-act="chiudi-foglio">Lascia com\'è</button>');
  }

  /* ---------------- Copia di sicurezza ---------------- */
  function esporta() {
    var dati = { app: 'corpo-libero', versione: 1, esportato: oggi(), profilo: S.profilo, archivi: S.archivi };
    var blob = new Blob([JSON.stringify(dati, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'forze-speciali-' + S.profilo + '-' + oggi() + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    S.ultimaCopia = oggi(); salva();
    toast('File salvato nei Download');
    render(false);
  }
  function pulisci(archivi) {
    var out = {};
    ['GL', 'F', 'G'].forEach(function (p) {
      var x = archivi && archivi[p];
      if (!x || !Array.isArray(x.voci)) return;
      var voci = x.voci.filter(function (v) {
        return v && (v.t === 'fatto' || v.t === 'riparti') && v.n === Math.floor(v.n) && v.n >= 1 && v.n <= 100 && /^\d{4}-\d{2}-\d{2}$/.test(v.data);
      }).map(function (v) {
        var o = { id: String(v.id || uid()), t: v.t, n: v.n, data: v.data };
        if (v.t === 'fatto') { if (v.nota) o.nota = String(v.nota).slice(0, 500); if (v.leggera) o.leggera = true; if (v.rec) o.rec = true; }
        return o;
      });
      out[p] = { voci: voci, giri: {}, ripresa: x.ripresa || null, leggera: !!x.leggera };
    });
    return out;
  }
  var daImportare = null;
  function leggiFile(file) {
    var fr = new FileReader();
    fr.onload = function () {
      var o = null;
      try { o = JSON.parse(fr.result); } catch (e) { o = null; }
      if (!o || o.app !== 'corpo-libero' || !o.archivi) { toast('Il file non è una copia di questa app'); return; }
      daImportare = { profilo: o.profilo, archivi: pulisci(o.archivi) };
      var righe = Object.keys(daImportare.archivi).map(function (p) {
        var f = daImportare.archivi[p].voci.filter(function (v) { return v.t === 'fatto'; });
        if (!f.length) return '';
        var ult = f.map(function (v) { return v.data; }).sort().pop();
        return '<li><b>' + p + '</b>: ' + f.length + (f.length === 1 ? ' allenamento' : ' allenamenti') + ', l\'ultimo ' + giorno(ult) + '/' + dt(ult).getFullYear() + '</li>';
      }).join('');
      var quando = /^\d{4}-\d{2}-\d{2}/.test(o.esportato || '') ? '<p class="small">Copia del ' + ddmm(o.esportato.slice(0, 10)) + '/' + o.esportato.slice(0, 4) + '.</p>' : '';
      apriFoglio('<h2 id="sh-t">Importi la copia?</h2>' + quando +
        (righe ? '<ul>' + righe + '</ul>' : '<p>Il file non contiene allenamenti.</p>') +
        '<p class="note warn">Sostituisce l\'archivio che c\'è ora su questo telefono.</p>' +
        '<button type="button" class="primary" data-act="conferma-importa">Importa</button><button type="button" class="textbtn" data-act="chiudi-foglio">Annulla</button>');
    };
    fr.readAsText(file);
  }

  /* ---------------- Azioni ---------------- */
  var toastT = null;
  function toast(t) {
    var d = el('toast');
    d.textContent = t; d.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(function () { d.hidden = true; }, 2200);
  }
  var azioni = {
    indietro: function (b) { indietro(b.dataset.f || '#/elenco'); },
    profilo: function (b) {
      profSel = b.dataset.p;
      document.querySelectorAll('.ptile').forEach(function (x) { x.setAttribute('aria-checked', String(x.dataset.p === profSel)); });
      document.querySelector('[data-act="profilo-ok"]').disabled = false;
    },
    'profilo-ok': function () {
      if (!profSel) return;
      var primo = !S.profilo;
      S.profilo = profSel; salva(); profSel = null;
      if (primo) vai('#/elenco', true); else indietro('#/elenco');
    },
    giro: function (b) {
      var a = A(), n = +parse(location.hash).p[1], k = +b.dataset.c, g = +b.dataset.g;
      var arr = a.giri[n] || []; arr[k] = (arr[k] || 0) === g ? g - 1 : g; a.giri[n] = arr; salva();
      document.querySelectorAll('.giro[data-c="' + k + '"]').forEach(function (x) { x.setAttribute('aria-pressed', String(+x.dataset.g <= arr[k])); });
    },
    segna: function (b) { foglioSegna(+b.dataset.n); },
    'salva-fatto': function (b) { salvaFatto(+b.dataset.n); },
    'chiudi-foglio': function () { chiudiFoglio(); },
    'annulla-fatto': function (b) { foglioAnnulla(b.dataset.id); },
    'annulla-riparti': function (b, ev) { ev.preventDefault(); foglioAnnulla(b.dataset.id); },
    'conferma-annulla': function (b) {
      var a = A(), id = b.dataset.id, v = a.voci.filter(function (x) { return x.id === id; })[0];
      a.voci = a.voci.filter(function (x) { return x.id !== id; }); salva();
      var suArchivio = parse(location.hash).p[0] === 'archivio' || parse(location.hash).q.da === 'archivio';
      chiudiFoglio(function () {
        if (parse(location.hash).p[0] === 'a') indietro(suArchivio ? '#/archivio' : '#/elenco'); else render(false);
        toast(v && v.t === 'riparti' ? 'Ripartenza annullata' : 'Annullato');
      });
    },
    ripresa: function (b) {
      var a = A(), rr = R(), gg = giorni(rr.ultimaData, oggi());
      if (b.dataset.v === 'solo') { a.ripresa = { per: rr.ultimaData, scelta: 'solo' }; a.leggera = true; toast('La prima seduta sarà in versione leggera'); }
      else if (gg <= 28) { a.ripresa = { per: rr.ultimaData, scelta: 'gruppo' }; a.leggera = true; toast('Il prossimo si fa in versione leggera'); }
      else a.ripresa = { per: rr.ultimaData, scelta: 'gruppo', lungo: true };
      salva(); render(false);
    },
    'ripresa-chiudi': function () { var a = A(); if (a.ripresa) a.ripresa.chiuso = true; salva(); render(false); },
    riparti: function (b) {
      var a = A(), n = +b.dataset.n;
      a.voci.push({ id: uid(), t: 'riparti', n: n, data: oggi() });
      if (a.ripresa) a.ripresa.chiuso = true;
      salva(); render(false); toast('Si riparte dal ' + n);
    },
    'leggera-no': function () { A().leggera = false; salva(); render(false); },
    esporta: esporta,
    importa: function () { var f = el('file-importa'); f.value = ''; f.click(); },
    'conferma-importa': function () {
      if (!daImportare) return;
      S.archivi = daImportare.archivi;
      if (!S.profilo && daImportare.profilo) S.profilo = daImportare.profilo;
      daImportare = null; salva();
      chiudiFoglio(function () { render(false); toast('Archivio importato'); });
    },
    installa: function () { if (!installa) return; installa.prompt(); installa.userChoice.then(function () { installa = null; render(false); }); },
    'installa-no': function () { S.noInstalla = true; salva(); render(false); },
    aggiorna: function () { if (swAttesa) { aggiornando = true; swAttesa.postMessage('aggiorna'); } },
    't-play': function () {
      if (T.i >= T.ph.length) { T.i = 0; T.left = T.ph[0].s; T.beeped = {}; }
      T.run = !T.run;
      if (T.run) {
        try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {}
        tieniAcceso();
        T.last = performance.now(); clearInterval(iv); iv = setInterval(tick, 200);
      } else { clearInterval(iv); rilascia(); }
      disegnaTimer();
    },
    't-reset': function () { fermaTimer(); T.i = 0; T.left = T.ph[0].s; T.beeped = {}; disegnaTimer(); },
    't-skip': function () {
      if (T.i >= T.ph.length) return;
      T.i++;
      if (T.i < T.ph.length) T.left = T.ph[T.i].s; else fermaTimer();
      T.last = performance.now(); disegnaTimer();
    }
  };

  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]');
    if (b) { if (b.tagName === 'A') ev.preventDefault(); var f = azioni[b.dataset.act]; if (f) f(b, ev); return; }
    var a = ev.target.closest('a[href^="#/"]');
    if (a) { ev.preventDefault(); vai(a.getAttribute('href'), a.hasAttribute('data-replace')); }
  });
  document.addEventListener('toggle', function (ev) { var d = ev.target; if (d.classList && d.classList.contains('blk')) aperti[d.dataset.a] = d.open; }, true);
  document.addEventListener('input', function (ev) {
    if (ev.target.id === 'f-data') { var b = fogli.querySelector('[data-act="salva-fatto"]'); el('f-riposo').textContent = testoRiposo(+b.dataset.n, ev.target.value); }
  });
  document.addEventListener('change', function (ev) { if (ev.target.id === 'file-importa' && ev.target.files[0]) leggiFile(ev.target.files[0]); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && foglio) chiudiFoglio(); });

  /* ---------------- App installabile e aggiornamenti ---------------- */
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installa = e; if (parse(location.hash).p[0] === 'elenco') render(false); });
  window.addEventListener('appinstalled', function () { installa = null; });
  if ('serviceWorker' in navigator && !ANTEPRIMA && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      function controlla() {
        if (reg.waiting && navigator.serviceWorker.controller) { swAttesa = reg.waiting; if (parse(location.hash).p[0] === 'elenco') render(false); }
      }
      controlla();
      reg.addEventListener('updatefound', function () {
        var nw = reg.installing;
        if (nw) nw.addEventListener('statechange', function () { if (nw.state === 'installed') controlla(); });
      });
    }).catch(function () {});
    navigator.serviceWorker.addEventListener('controllerchange', function () { if (aggiornando) location.reload(); });
  }

  /* ---------------- Avvio ---------------- */
  history.replaceState({ d: 0 }, '', location.hash && location.hash.length > 2 ? location.hash : (S.profilo ? '#/elenco' : '#/profilo'));
  render(true);
})();

</script>
